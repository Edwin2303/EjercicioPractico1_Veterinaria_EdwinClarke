<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de servicio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<h2 th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}"></h2>
<form method="post" th:action="@{/servicios/guardar}" th:object="${servicio}">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
<div class="mb-3"><label class="form-label">Precio</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{precio}" required></div>
<div class="mb-3"><label class="form-label">Duración en minutos</label><input class="form-control" type="number" min="1" th:field="*{duracionMinutos}" required></div>
<div class="mb-3"><label class="form-label">Tipo de servicio</label><select class="form-select" name="tipoId" required><option value="">Seleccione...</option><option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}" th:selected="${servicio.tipoServicio != null and servicio.tipoServicio.id == tipo.id}"></option></select></div>
<button class="btn btn-success">Guardar</button><a class="btn btn-secondary" th:href="@{/servicios}">Cancelar</a></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
