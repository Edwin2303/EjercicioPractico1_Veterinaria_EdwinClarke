<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicios veterinarios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="d-flex justify-content-between align-items-center mb-3"><h2>Servicios veterinarios</h2><a class="btn btn-success" th:href="@{/servicios/nuevo}">Agregar servicio</a></div>
<table class="table table-striped"><thead><tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Duración (min)</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="servicio : ${servicios}"><td th:text="${servicio.nombre}"></td><td th:text="${servicio.tipoServicio.nombre}"></td>
<td th:text="${#numbers.formatDecimal(servicio.precio,1,2)}"></td><td th:text="${servicio.duracionMinutos}"></td>
<td><a class="btn btn-sm btn-primary" th:href="@{/servicios/editar/{id}(id=${servicio.id})}">Editar</a>
<button class="btn btn-sm btn-danger" data-bs-toggle="modal" th:attr="data-bs-target='#modalServicio'+${servicio.id}">Eliminar</button>
<div class="modal fade" th:id="'modalServicio'+${servicio.id}" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Confirmar eliminación</h5></div><div class="modal-body">¿Desea eliminar este servicio?</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form method="post" th:action="@{/servicios/eliminar/{id}(id=${servicio.id})}"><button class="btn btn-danger">Eliminar</button></form></div></div></div></div>
</td></tr></tbody></table>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
