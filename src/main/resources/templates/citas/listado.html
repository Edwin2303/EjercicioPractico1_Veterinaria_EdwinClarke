<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citas programadas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<h2>Citas programadas</h2><table class="table table-striped"><thead><tr><th>Mascota</th><th>Propietario</th><th>Fecha</th><th>Servicio</th></tr></thead><tbody>
<tr th:each="cita : ${citas}"><td th:text="${cita.nombreMascota}"></td><td th:text="${cita.nombrePropietario}"></td><td th:text="${#temporals.format(cita.fecha,'dd/MM/yyyy')}"></td><td th:text="${cita.servicio.nombre}"></td></tr>
</tbody></table>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
