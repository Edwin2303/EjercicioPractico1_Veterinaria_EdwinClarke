<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de tipo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<h2 th:text="${tipo.id == null ? 'Nuevo tipo de servicio' : 'Editar tipo de servicio'}"></h2>
<form method="post" th:action="@{/tipos/guardar}" th:object="${tipo}">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
<div class="mb-3"><label class="form-label">Descripción</label><input class="form-control" th:field="*{descripcion}"></div>
<button class="btn btn-success">Guardar</button><a class="btn btn-secondary" th:href="@{/tipos}">Cancelar</a></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
